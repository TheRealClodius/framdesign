name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Generated, gitignored; the chat route and tool tests load it
      - run: npm run build:tools

      # TODO: make blocking once the existing backlog (mostly no-explicit-any) is cleared
      - run: npm run lint
        continue-on-error: true

      - name: Typecheck
        run: npx tsc --noEmit

      # TODO: make blocking once the e2e/GCS/Gemini suites skip without credentials
      # (15 suites currently fail without live services, on main as well)
      - run: npm test -- --ci
        continue-on-error: true

      - run: npm run build
